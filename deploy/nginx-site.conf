# nginx site for Bookkeeping AI on one domain.
#   /api/...  → the backend (Express, port 4000)
#   everything else → the web app (Next.js, port 3000)
# Both run only on 127.0.0.1; nginx is the only thing open to the internet.
#
# Installed by docs/DEPLOY.md step 9, which replaces DOMAIN_NAME with your domain.
# certbot (step 10) then adds HTTPS to both server blocks below.

# www.yourdomain.com → yourdomain.com, so there's one address (and one set of cookies).
server {
    listen 80;
    listen [::]:80;
    server_name www.DOMAIN_NAME;
    return 301 https://DOMAIN_NAME$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_NAME;

    # Spreadsheet imports are up to 5 MB; nginx's default limit is 1 MB.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A chat reply can take a while when the assistant uses several tools.
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
