openapi: 3.0.3
info:
  title: Bookkeeping Agent API
  description: REST API for the Bookkeeping Agent MVP — transaction management, AI-powered chat, reports, and alerts for small shop owners.
  version: 1.0.0
  contact:
    name: Bookkeeping Agent Team

servers:
  - url: https://api.yourdomain.com/api/v1
    description: Production
  - url: http://localhost:4000/api/v1
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: auth
    description: Registration, login, token management
  - name: shops
    description: Shop creation and management
  - name: transactions
    description: Ledger entries — sales, expenses, receivables, payables
  - name: chat
    description: AI chat sessions
  - name: stock
    description: Products, stock movements, shelf counts and low-stock alerts
  - name: reports
    description: PDF report generation
  - name: alerts
    description: Alert management and history
  - name: account
    description: The signed-in owner's own settings
  - name: imports
    description: Excel/CSV bulk upload pipeline
  - name: admin
    description: Business dashboard for the app's admins (counts and costs only)
  - name: health
    description: Service health

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:

  # ── HEALTH ──────────────────────────────────
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Returns 200 when the service is up. No auth required.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ── AUTH ─────────────────────────────────────
  /auth/signup:
    post:
      tags: [auth]
      summary: Register a new user
      security: []
      x-rateLimit: '10 requests per hour per IP'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              name: Amara Osei
              email: amara@example.com
              phone: '+2348012345678'
              password: 'S3cur3P@ss!'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate and receive tokens
      security: []
      x-rateLimit: '5 failed attempts per account → 15-minute account lockout; 25 failed attempts per IP per 15 minutes (set high because mobile carriers share one IP across many phones)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: amara@example.com
              password: 'S3cur3P@ss!'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie (refresh_token=...; HttpOnly; Secure; SameSite=Strict)
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate access token using refresh token
      security: []
      description: |
        Reads the refresh token from the HttpOnly `refresh_token` cookie (Path=/api/v1/auth)
        set at signup/login. Every call rotates it: the presented token is revoked and a new
        one is set. Presenting an already-rotated token more than 30 seconds after its
        rotation is treated as theft, and revokes that device's session. The app calls this
        on every load to restore the session, so the response includes the user.
      responses:
        '200':
          description: New access token issued, refresh cookie rotated
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, user]
                properties:
                  accessToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate refresh token and clear cookie
      security: []
      description: |
        Signs out this device only (other devices stay signed in). Identified by the refresh
        cookie, not the access token, so it works after the access token has expired.
        Always succeeds, even with no cookie.
      responses:
        '204':
          description: Logged out
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Confirm an email address from the link in the confirmation email
      description: No login needed. Each link works once, for 48 hours, and only for the address it was sent to.
      x-rateLimit: '20 requests per 15 minutes per IP'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Confirmed
          content: { application/json: { schema: { type: object, properties: { verified: { type: boolean } } } } }
        '400':
          description: Link invalid, expired or already used (plain-English message)

  /auth/resend-verification:
    post:
      tags: [auth]
      summary: Send a new confirmation email
      description: Earlier links stop working. Sign-up sends the first one.
      x-rateLimit: '5 per hour per user'
      responses:
        '200':
          description: Sent, or already confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  email: { type: string }
                  alreadyVerified: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many requests

  /account/alert-settings:
    get:
      tags: [account]
      summary: How alerts reach the owner
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/AlertSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [account]
      summary: Change alert settings
      description: Equal quietStart and quietEnd mean no quiet hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emailAlerts: { type: boolean }
                quietStart: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '22:00' }
                quietEnd: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '07:00' }
      responses:
        '200': { description: Updated settings, content: { application/json: { schema: { $ref: '#/components/schemas/AlertSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── ADMIN (business dashboard) ─────────────
  /admin/overview:
    get:
      tags: [admin]
      summary: The app's numbers for the last 30 days
      description: |
        Admins only (users.is_admin, set on the server with `npm run make-admin -- email`).
        To anyone else it doesn't exist: 404 like an unknown path. An expired token still
        gets 401, so the admin's app can refresh it.
        Counts and costs only; no shop's amounts, customers or descriptions. "Active" means
        the owner opened the app that day. Admin accounts are left out of users, activity,
        returning and accuracy, but AI spending includes them. Days are business days
        (BUSINESS_TIME_ZONE).
      responses:
        '200': { description: Overview, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOverview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'Not an admin, or not signed in: the same answer as a path that does not exist' }

  /admin/users:
    get:
      tags: [admin]
      summary: Every account with its last 30 days of use, most AI spending first (top 200)
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
                  total: { type: integer }
                  limit: { type: integer, example: 200 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'Not an admin, or not signed in: the same answer as a path that does not exist' }

  # ── SHOPS ────────────────────────────────────
  /shops:
    get:
      tags: [shops]
      summary: List all shops owned by the authenticated user
      x-rateLimit: '120 requests per minute'
      responses:
        '200':
          description: Array of shops
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [shops]
      summary: Create a new shop
      x-rateLimit: '20 requests per hour'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShopRequest'
            example:
              name: 'Amara Provisions'
              type: retail
              location: 'Lagos, Nigeria'
              currency: NGN
      responses:
        '201':
          description: Shop created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /shops/{shopId}:
    parameters:
      - $ref: '#/components/parameters/shopId'
    get:
      tags: [shops]
      summary: Get a single shop
      x-rateLimit: '120 requests per minute'
      responses:
        '200':
          description: Shop details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [shops]
      summary: Update shop details
      x-rateLimit: '60 requests per minute'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShopRequest'
      responses:
        '200':
          description: Updated shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /shops/switch:
    post:
      tags: [shops]
      summary: Set active shop context for the current session
      description: The active shop is stored server-side in the user's session so subsequent chat messages reference it automatically.
      x-rateLimit: '60 requests per minute'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId]
              properties:
                shopId:
                  type: string
                  format: uuid
            example:
              shopId: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
      responses:
        '200':
          description: Active shop updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeShopId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── TRANSACTIONS ─────────────────────────────
  /shops/{shopId}/branding/{kind}:
    parameters:
      - $ref: '#/components/parameters/shopId'
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [logo, signature]
    put:
      tags: [shops]
      summary: Upload or replace the shop's receipt logo or signature
      description: |
        Max 2 MB; PNG or JPEG (checked from the file's bytes, not its name or type) — the formats the
        PDF generator can embed. The client already converts the image to a grayscale PNG and scales it
        to at most 600×300 px, because receipts are printed in black and white. The server stores the file
        under a new random name on every upload and sets `logoUrl` or `signatureUrl` to
        `/api/v1/files/branding/{key}` (public, cacheable forever); the replaced file is deleted.
      x-rateLimit: '20 requests per hour'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [shops]
      summary: Remove the shop's receipt logo or signature
      responses:
        '200':
          description: Updated shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /shops/{shopId}/transactions:
    parameters:
      - $ref: '#/components/parameters/shopId'

    get:
      tags: [transactions]
      summary: List transactions with optional filters
      x-rateLimit: '120 requests per minute'
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [sale, expense, receivable, payable]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, settled, overdue]
        - name: category
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          example: '2024-01-01'
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          example: '2024-01-31'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [transactions]
      summary: Create a transaction
      description: Claude categorizes the transaction automatically if `category` is omitted.
      x-rateLimit: '300 requests per minute'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
            example:
              type: sale
              amount: 5000
              currency: NGN
              description: 'Sold 10 bags of rice'
              date: '2024-01-15'
              counterparty: 'Chukwu Market'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /shops/{shopId}/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/shopId'
      - $ref: '#/components/parameters/transactionId'

    get:
      tags: [transactions]
      summary: Get a single transaction
      x-rateLimit: '120 requests per minute'
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [transactions]
      summary: Update a transaction
      description: |
        For a credit sale or bill on credit, `status` is driven by its payments: `settled` records a
        payment of whatever is still owed (dated today), `pending` removes all its payments, `overdue`
        just flags it. Prefer the payments endpoints below, which support part-payments and dates.
        Returns 400 if `amount` would drop below what has already been paid, or if `type` would turn a
        debt with payments into a cash sale or expense.
      x-rateLimit: '120 requests per minute'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [transactions]
      summary: Delete a transaction
      x-rateLimit: '60 requests per minute'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /shops/{shopId}/transactions/{transactionId}/payments:
    parameters:
      - $ref: '#/components/parameters/shopId'
      - $ref: '#/components/parameters/transactionId'

    get:
      tags: [transactions]
      summary: List payments towards a debt, oldest first
      x-rateLimit: '120 requests per minute'
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DebtPayment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [transactions]
      summary: Record a payment (full or part) towards a credit sale or bill on credit
      description: |
        The debt's status follows its payments: it becomes `settled` once they cover the amount. A
        payment is never recorded as a new sale, which would count the income twice. Refused with 422
        (plain-English `message`) when the transaction isn't a debt, is already paid, the amount is more
        than is still owed, or `paidOn` is in the future or before the debt's date.
      x-rateLimit: '120 requests per minute'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 0.01
                  description: Omit to pay off everything still owed.
                paidOn:
                  type: string
                  format: date
                  description: Omit for today (in the shop's time zone).
            example:
              amount: 5000
              paidOn: '2026-09-20'
      responses:
        '201':
          description: Payment recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: '#/components/schemas/Transaction'
                  payment:
                    $ref: '#/components/schemas/DebtPayment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Payment refused (see description)

  /shops/{shopId}/transactions/{transactionId}/payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/shopId'
      - $ref: '#/components/parameters/transactionId'
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      tags: [transactions]
      summary: Undo a payment
      description: Removes the payment; a paid debt reopens as unpaid.
      x-rateLimit: '120 requests per minute'
      responses:
        '200':
          description: The debt after the payment was removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── STOCK ────────────────────────────────────
  /shops/{shopId}/stock/products:
    parameters:
      - $ref: '#/components/parameters/shopId'
    get:
      tags: [stock]
      summary: List products on the stock list
      parameters:
        - { name: lowOnly, in: query, schema: { type: boolean }, description: Only products at or below their warning level }
        - { name: search, in: query, schema: { type: string }, description: Part of a product name }
        - { name: includeArchived, in: query, schema: { type: boolean }, description: Include removed products }
      responses:
        '200':
          description: Products, by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [stock]
      summary: Add a product
      description: '`openingQuantity` is what is on the shelf now. 409 if a live product already has the name (any case).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProductFields'
                - type: object
                  required: [name]
                  properties:
                    openingQuantity: { type: number, minimum: 0 }
      responses:
        '201': { description: Product added, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: A product with that name already exists }

  /shops/{shopId}/stock/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/shopId'
      - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [stock]
      summary: Get a product
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [stock]
      summary: Edit a product (name, unit, warning level, prices)
      description: Quantities change only through movements, counts and transactions. Setting `lowStockLevel` to null turns the warning off.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductFields' } } }
      responses:
        '200': { description: Updated product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A product with that name already exists }
    delete:
      tags: [stock]
      summary: Remove a product from the stock list
      description: Its history is kept, so past sales and reports still show it. Its low-stock alert is resolved and its name can be reused.
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /shops/{shopId}/stock/products/{productId}/movements:
    parameters:
      - $ref: '#/components/parameters/shopId'
      - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [stock]
      summary: A product's stock history, newest first
      responses:
        '200':
          description: Movements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [stock]
      summary: Add or remove stock by hand
      description: |
        `restock` adds stock that came in with nothing to record as a purchase (to record what was paid,
        create an expense or payable with `items` instead). `adjustment` is anything else, usually
        negative: damaged, expired, used in the shop. 422 for a future date or a zero change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, change]
              properties:
                kind: { type: string, enum: [restock, adjustment] }
                change: { type: number, description: '+ into stock, − out of stock; restock must be positive' }
                occurredOn: { type: string, format: date, description: Omit for today }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/Product' }
                  movement: { $ref: '#/components/schemas/StockMovement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Refused (see description) }

  /shops/{shopId}/stock/movements/{movementId}:
    parameters:
      - $ref: '#/components/parameters/shopId'
      - { name: movementId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [stock]
      summary: Undo a hand-entered stock change or shelf count
      description: Stock moved by a sale or purchase can't be undone here (422); edit or delete that transaction instead.
      responses:
        '200': { description: The product after the undo, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: The change came from a transaction }

  /shops/{shopId}/stock/counts:
    parameters:
      - $ref: '#/components/parameters/shopId'
    post:
      tags: [stock]
      summary: Record a shelf count
      description: |
        What is actually on the shelf. Each product's stock becomes the counted quantity, and the reply
        gives what the records expected and the difference (negative: missing). The difference is always
        worked out from the records before the count, so a sale dated before the count but entered
        afterwards isn't taken off twice. 400 if a product appears twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, counted]
                    properties:
                      productId: { type: string, format: uuid }
                      counted: { type: number, minimum: 0 }
                occurredOn: { type: string, format: date, description: Omit for today }
                note: { type: string }
      responses:
        '201':
          description: Count results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        product: { $ref: '#/components/schemas/Product' }
                        counted: { type: number }
                        expected: { type: number }
                        difference: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── CHAT ─────────────────────────────────────
  /chat/sessions:
    get:
      tags: [chat]
      summary: List chat sessions for the current user
      x-rateLimit: '60 requests per minute'
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter sessions by shop
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatSession'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [chat]
      summary: Create a new chat session
      x-rateLimit: '30 requests per hour'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId]
              properties:
                shopId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /chat/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/sessionId'

    get:
      tags: [chat]
      summary: Get message history for a session
      x-rateLimit: '60 requests per minute'
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Message history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [chat]
      summary: Send a message and get an AI response
      description: |
        Sends the user's message to Claude with shop context assembled from recent transactions.
        The response may include structured transaction data that the backend persists automatically.
      x-rateLimit: '60 requests per minute'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              content: 'I sold 20 bags of rice for 8000 naira today'
              type: text
      responses:
        '200':
          description: AI response with optional extracted transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── REPORTS ──────────────────────────────────
  /reports/receipt:
    post:
      tags: [reports]
      summary: Generate a receipt PDF for a transaction
      description: |
        An 80 mm-wide receipt (or invoice, for a credit sale) with the shop's logo and, on invoices,
        signature. Sales and credit sales only; an expense or bill returns 422.
      x-rateLimit: '30 requests per minute per user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId, shopId]
              properties:
                transactionId:
                  type: string
                  format: uuid
                shopId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="receipt-2024-01-15.pdf"'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/credit:
    post:
      tags: [reports]
      summary: Generate a credit (receivables) report PDF
      description: |
        A snapshot as of `dateTo` (or today, if `dateTo` is later): who owed the shop on that day (by
        customer and itemised, with part-payments and days late), the payments received in the date
        range, the shop's unpaid bills and what it paid suppliers. Payments count on the day they were
        made, so a payment after `dateTo` isn't included.
      x-rateLimit: '10 requests per minute per user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateRangeReportRequest'
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/stock:
    post:
      tags: [reports]
      summary: Generate a stock report PDF
      description: |
        Stock as of `dateTo` (or today, if later): products running low or out, and per product the
        quantity at the start, stock bought or added, sold, shelf-count differences, other adjustments,
        the quantity at the end and its value at cost price. Lists the shelf counts in the period.
      x-rateLimit: '10 requests per minute per user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateRangeReportRequest'
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/pl:
    post:
      tags: [reports]
      summary: Generate a Profit & Loss statement PDF
      description: |
        Accrual basis: every transaction counts on its own date, so a credit sale is income on the day
        of the sale and a bill on credit is a cost on the day received. The PDF also shows how much of
        each was still unpaid at the end of the period. A debt being paid later is recorded as a payment
        against it (`/transactions/{id}/payments`), never as a new sale.
      x-rateLimit: '10 requests per minute per user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateRangeReportRequest'
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── ALERTS ───────────────────────────────────
  /alerts:
    get:
      tags: [alerts]
      summary: List active alerts for the current user
      x-rateLimit: '60 requests per minute'
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [active, acknowledged, dismissed, resolved]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Alert list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /alerts/history:
    get:
      tags: [alerts]
      summary: View full alert history (all statuses)
      x-rateLimit: '60 requests per minute'
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
            format: uuid
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Alert history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertHistory'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /alerts/{alertId}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/alertId'
    patch:
      tags: [alerts]
      summary: Acknowledge an alert
      x-rateLimit: '60 requests per minute'
      responses:
        '200':
          description: Alert acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /alerts/{alertId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/alertId'
    patch:
      tags: [alerts]
      summary: Dismiss an alert
      x-rateLimit: '60 requests per minute'
      responses:
        '200':
          description: Alert dismissed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── IMPORTS ──────────────────────────────────
  /imports/upload:
    post:
      tags: [imports]
      summary: Upload an Excel or CSV file for processing
      description: Max 10 MB. Returns an importId to use in subsequent steps.
      x-rateLimit: '10 requests per hour'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, shopId]
              properties:
                file:
                  type: string
                  format: binary
                shopId:
                  type: string
                  format: uuid
      responses:
        '202':
          description: File accepted; schema detection in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File too large (max 10 MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /imports/{importId}/validate:
    parameters:
      - $ref: '#/components/parameters/importId'
    post:
      tags: [imports]
      summary: Run validation on an uploaded file
      description: Validates all rows and returns per-row errors.
      x-rateLimit: '10 requests per hour'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportColumnMapping'
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /imports/{importId}/preview:
    parameters:
      - $ref: '#/components/parameters/importId'
    get:
      tags: [imports]
      summary: Preview first 20 rows with detected schema
      x-rateLimit: '30 requests per minute'
      responses:
        '200':
          description: Preview data + detected column mappings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /imports/{importId}/confirm:
    parameters:
      - $ref: '#/components/parameters/importId'
    post:
      tags: [imports]
      summary: Confirm and ingest validated rows into the database
      description: Only rows that passed validation are ingested. Error rows are skipped unless `skipErrors` is false.
      x-rateLimit: '5 requests per hour'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skipErrors:
                  type: boolean
                  default: true
                  description: If false, abort if any row has errors.
      responses:
        '200':
          description: Ingestion summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Import already confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

# ─────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    shopId:
      name: shopId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    transactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    alertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    importId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: BAD_REQUEST
            message: 'amount must be a positive number'
            details: []
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: UNAUTHORIZED
            message: 'Token is expired or missing'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NOT_FOUND
            message: 'Shop not found'
    Conflict:
      description: Conflict with existing resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: CONFLICT
            message: 'Email already registered'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: TOO_MANY_REQUESTS
            message: 'Too many login attempts. Try again in 15 minutes.'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the client may retry
    UnprocessableEntity:
      description: Request valid but unable to process (e.g. Claude API error)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INTERNAL_SERVER_ERROR
            message: 'An unexpected error occurred'

  schemas:

    # ── Common ──────────────────────────────────
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable description
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: '1.0.0'

    # ── Auth ────────────────────────────────────
    SignupRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164 format e.g. +2348012345678
        password:
          type: string
          minLength: 8
          description: Must contain uppercase, lowercase, digit, special char

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT; expires in 15 minutes
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        emailVerified:
          type: boolean
          description: Alerts are only emailed to a confirmed address. Settings are at /account/alert-settings.
        isAdmin:
          type: boolean
          description: Only present, as true, for admins (who can open the business dashboard). Set on the server only.

    AdminOverview:
      type: object
      properties:
        today: { type: string, format: date }
        windowStart: { type: string, format: date, description: First day of the 30-day window }
        users:
          type: object
          properties:
            total: { type: integer }
            verified: { type: integer }
            newInWindow: { type: integer }
            activeToday: { type: integer }
            active7: { type: integer }
            active30: { type: integer }
        ai:
          type: object
          description: US dollars. costPerMessage and costPerChatUser are null when there were no messages.
          properties:
            messagesToday: { type: integer }
            costToday: { type: number }
            messages: { type: integer, description: Owner messages answered in the window }
            cost: { type: number }
            failed: { type: integer, description: Messages the assistant couldn't answer }
            costPerMessage: { type: number, nullable: true }
            chatUsers: { type: integer }
            costPerChatUser: { type: number, nullable: true }
            monthToDate: { type: number }
            monthProjected: { type: number, description: monthToDate spread over the whole month }
            daily:
              type: array
              items:
                type: object
                properties:
                  day: { type: string, format: date }
                  messages: { type: integer }
                  cost: { type: number }
        accuracy:
          type: object
          description: Transactions the assistant recorded, and how many an owner later edited (what it filled in) or deleted.
          properties:
            recorded: { type: integer }
            corrected: { type: integer }
            rate: { type: number, nullable: true }
        returning:
          type: array
          description: Of owners who signed up at least afterDays ago, how many opened the app again afterDays or more after signing up.
          items:
            type: object
            properties:
              afterDays: { type: integer, enum: [7, 14, 28] }
              eligible: { type: integer }
              returned: { type: integer }
        emails:
          type: object
          properties:
            sent: { type: integer }
            failed: { type: integer }

    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        signedUp: { type: string, format: date }
        emailVerified: { type: boolean }
        isAdmin: { type: boolean }
        shops: { type: integer }
        lastActive: { type: string, format: date, nullable: true }
        activeDays: { type: integer, description: Days used in the last 30 }
        messages: { type: integer }
        cost: { type: number, description: US dollars, last 30 days }
        recorded: { type: integer }
        corrected: { type: integer }

    AlertSettings:
      type: object
      properties:
        emailAlerts: { type: boolean, description: 'Email alerts on (default) or off' }
        emailVerified: { type: boolean }
        email: { type: string, format: email }
        quietStart: { type: string, example: '22:00', description: Shop time (BUSINESS_TIME_ZONE) }
        quietEnd: { type: string, example: '07:00' }

    AlertPreferences:
      type: object
      properties:
        email:
          type: boolean
          default: true
        sms:
          type: boolean
          default: false
        whatsapp:
          type: boolean
          default: false
        quietHoursStart:
          type: string
          example: '22:00'
        quietHoursEnd:
          type: string
          example: '07:00'
        thresholds:
          type: object
          properties:
            lowCash:
              type: number
              example: 10000
            highPayable:
              type: number
              example: 50000
            overdueReceivableDays:
              type: integer
              example: 30

    # ── Shops ────────────────────────────────────
    Shop:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [retail, wholesale, services, food, other]
        location:
          type: string
        currency:
          type: string
          default: NGN
        logoUrl:
          type: string
          format: uri
          nullable: true
          description: Printed at the top of every receipt and invoice. Stored as a grayscale PNG.
        signatureUrl:
          type: string
          format: uri
          nullable: true
          description: Printed on invoices (credit sales) only, above the "Authorised signature" line.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateShopRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        type:
          type: string
          enum: [retail, wholesale, services, food, other]
        location:
          type: string
        currency:
          type: string
          default: NGN

    UpdateShopRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [retail, wholesale, services, food, other]
        location:
          type: string
        currency:
          type: string

    # ── Transactions ─────────────────────────────
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        type:
          type: string
          enum: [sale, expense, receivable, payable]
        amount:
          type: number
          format: float
        currency:
          type: string
        description:
          type: string
        category:
          type: string
          description: Auto-assigned by Claude if not provided
        counterparty:
          type: string
          description: Customer or supplier name
        date:
          type: string
          format: date
        dueDate:
          type: string
          format: date
          description: For receivables/payables
        status:
          type: string
          enum: [pending, settled, overdue]
        amountPaid:
          type: number
          description: Paid so far — payments towards a debt, or the full amount of a settled cash sale/expense.
        balance:
          type: number
          description: Still owed (0 when paid, and for cash sales/expenses).
        items:
          type: array
          description: Products sold or bought (GET one and POST responses only)
          items:
            type: object
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              unit: { type: string }
              quantity: { type: number }
        aiCategorized:
          type: boolean
        importId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductFields:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        unit: { type: string, maxLength: 30, description: 'bag, carton, piece, litre… (default: piece)' }
        lowStockLevel: { type: number, minimum: 0, nullable: true, description: Warn at or below this; null for no warning }
        costPrice: { type: number, minimum: 0, nullable: true }
        sellingPrice: { type: number, minimum: 0, nullable: true }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        name: { type: string }
        unit: { type: string }
        quantity: { type: number, description: On hand according to the records; below 0 if sales outran recorded stock }
        lowStockLevel: { type: number, nullable: true }
        costPrice: { type: number, nullable: true }
        sellingPrice: { type: number, nullable: true }
        isLow: { type: boolean }
        lastCountedOn: { type: string, format: date, nullable: true }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StockMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        kind: { type: string, enum: [opening, restock, sale, count, adjustment] }
        change: { type: number, description: '+ into stock, − out of stock' }
        counted: { type: number, nullable: true, description: For a shelf count, what was counted }
        transactionId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
        occurredOn: { type: string, format: date }
        createdAt: { type: string, format: date-time }

    TransactionItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: number, minimum: 0.01 }

    DebtPayment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        amount:
          type: number
        paidOn:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    CreateTransactionRequest:
      type: object
      required: [type, amount, date]
      properties:
        type:
          type: string
          enum: [sale, expense, receivable, payable]
        amount:
          type: number
          minimum: 0.01
        currency:
          type: string
          default: NGN
        description:
          type: string
          maxLength: 500
        category:
          type: string
          description: If omitted, Claude categorizes automatically
        counterparty:
          type: string
        date:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        items:
          type: array
          maxItems: 50
          description: |
            Products sold (sale/receivable: taken off the shelf) or bought (expense/payable: put on it).
            Saved together with the transaction. Deleting the transaction puts the stock back; changing
            its date moves the stock change with it. A transaction with items can't be switched between
            a sale and a purchase.
          items:
            $ref: '#/components/schemas/TransactionItemInput'

    UpdateTransactionRequest:
      type: object
      properties:
        type:
          type: string
          enum: [sale, expense, receivable, payable]
        amount:
          type: number
          minimum: 0.01
        description:
          type: string
        category:
          type: string
        counterparty:
          type: string
        date:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum: [pending, settled, overdue]

    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Chat ────────────────────────────────────
    ChatSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        type:
          type: string
          enum: [text, voice, image]
        content:
          type: string
        extractedTransactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
          description: Transactions the agent extracted and saved from this message
        receiptTransactionId:
          type: string
          format: uuid
          description: |
            Set when the user asked for a receipt and the agent resolved which transaction it is for.
            The client renders a printable receipt card for this transaction.
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 4000
        type:
          type: string
          enum: [text, voice, image]
          default: text
        mediaUrl:
          type: string
          description: URL to uploaded audio/image for voice or image messages

    ChatMessageResponse:
      type: object
      properties:
        userMessage:
          $ref: '#/components/schemas/ChatMessage'
        assistantMessage:
          $ref: '#/components/schemas/ChatMessage'

    # ── Reports ──────────────────────────────────
    DateRangeReportRequest:
      type: object
      required: [shopId, dateFrom, dateTo]
      properties:
        shopId:
          type: string
          format: uuid
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        sendEmail:
          type: boolean
          default: false
          description: Also email the report to the authenticated user

    # ── Alerts ───────────────────────────────────
    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        type:
          type: string
          enum: [low_cash, high_payable, overdue_receivable, duplicate, anomaly, low_stock, bill_due]
          description: |
            Raised today: overdue_receivable (a customer's debt past its due date), bill_due (a bill due
            within 2 days or overdue), low_stock, duplicate (the same transaction entered twice within 2
            minutes; in the app only). low_cash, high_payable and anomaly are reserved, not raised yet.
        status:
          type: string
          enum: [active, acknowledged, dismissed, resolved]
          description: '`resolved` is set by the app, e.g. when a low product is restocked'
        message:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AlertHistory:
      allOf:
        - $ref: '#/components/schemas/Alert'
        - type: object
          properties:
            deliveryChannels:
              type: array
              items:
                type: object
                properties:
                  channel:
                    type: string
                    enum: [email, sms, whatsapp, in_app]
                  status:
                    type: string
                    enum: [sent, failed, skipped]
                  deliveredAt:
                    type: string
                    format: date-time

    # ── Imports ──────────────────────────────────
    ImportJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        filename:
          type: string
        status:
          type: string
          enum: [uploaded, validating, validated, confirmed, failed]
        rowCount:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    ImportColumnMapping:
      type: object
      description: Maps detected file columns to known transaction fields
      properties:
        date:
          type: string
          description: Column name in file that maps to transaction date
        amount:
          type: string
        description:
          type: string
        type:
          type: string
        counterparty:
          type: string
        category:
          type: string

    ImportValidationResult:
      type: object
      properties:
        importId:
          type: string
          format: uuid
        totalRows:
          type: integer
        validRows:
          type: integer
        errorRows:
          type: integer
        qualityScore:
          type: number
          format: float
          description: 0.0–1.0 data quality score
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              field:
                type: string
              message:
                type: string

    ImportPreview:
      type: object
      properties:
        importId:
          type: string
          format: uuid
        detectedColumns:
          type: array
          items:
            type: object
            properties:
              columnName:
                type: string
              detectedType:
                type: string
                enum: [date, amount, text, unknown]
              suggestedMapping:
                type: string
        previewRows:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: true

    ImportResult:
      type: object
      properties:
        importId:
          type: string
          format: uuid
        rowsIngested:
          type: integer
        rowsSkipped:
          type: integer
        detectedPatterns:
          type: object
          properties:
            topCategory:
              type: string
            estimatedMonthlyRevenue:
              type: number
            estimatedMonthlyExpenses:
              type: number
